name: Guestbook

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  sign:
    if: ${{ startsWith(github.event.issue.title, '[guestbook]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add guestbook entry, commit, close issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const README = 'README.md';
            const START = '<!--GUESTBOOK:START-->';
            const END = '<!--GUESTBOOK:END-->';
            const MAX_ENTRIES = 20;

            const issue = context.payload.issue;
            const author = issue.user.login;
            const issueNumber = issue.number;

            // --- sanitize the visitor message into a single safe table cell ---
            function sanitize(raw) {
              let s = (raw || '').toString();
              s = s.replace(/<!--[\s\S]*?-->/g, '');     // strip HTML comments
              s = s.replace(/<[^>]*>/g, '');             // strip HTML tags
              s = s.replace(/&lt;/g, '<').replace(/&gt;/g, '>')
                   .replace(/&quot;/g, '"').replace(/&#39;/g, "'")
                   .replace(/&amp;/g, '&');
              s = s.replace(/\s+/g, ' ').trim();         // collapse to one line
              s = s.replace(/\\/g, '\\\\').replace(/\|/g, '\\|').replace(/`/g, '\\`');
              if (s.length > 280) s = s.slice(0, 277) + '...';
              return s || '(no message)';
            }

            const message = sanitize(issue.body);
            const today = new Date().toISOString().slice(0, 10);
            const avatar = `<img src="https://github.com/${author}.png?size=20" width="20" valign="middle"/>`;
            const newRow = `| ${avatar} [@${author}](https://github.com/${author}) | ${today} | ${message} |`;

            let readme = fs.readFileSync(README, 'utf8');
            const startIdx = readme.indexOf(START);
            const endIdx = readme.indexOf(END);
            if (startIdx === -1 || endIdx === -1 || endIdx < startIdx) {
              core.setFailed(`Missing ${START} / ${END} markers in README.md`);
              return;
            }

            const before = readme.slice(0, startIdx + START.length);
            const between = readme.slice(startIdx + START.length, endIdx);
            const after = readme.slice(endIdx);

            // Keep the table header/separator; collect existing data rows.
            const headerLines = [];
            const dataRows = [];
            for (const line of between.split('\n')) {
              if (/^\s*\|\s*(<img|\[@)/.test(line)) {
                dataRows.push(line.trim());
              } else if (line.trim() !== '') {
                headerLines.push(line.trim());
              }
            }

            const rows = [newRow, ...dataRows].slice(0, MAX_ENTRIES);
            const newBetween = '\n' + headerLines.join('\n') + '\n' + rows.join('\n') + '\n';
            fs.writeFileSync(README, before + newBetween + after, 'utf8');

            execSync('git config user.name "github-actions[bot]"');
            execSync('git config user.email "41898282+github-actions[bot]@users.noreply.github.com"');
            execSync('git add README.md');
            const status = execSync('git status --porcelain').toString().trim();
            if (status) {
              execSync(`git commit -m "guestbook: entry from @${author} (#${issueNumber})"`);
              execSync('git push');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `Thanks for signing the guestbook, @${author}! Your entry is live on my profile. Closing this. 🎉`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed',
            });
